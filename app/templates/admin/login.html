{% extends "admin/base.html" %}

{% block body %}
<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-geo-alt-fill" style="font-size: 48px; color: var(--primary);"></i>
            <h3 class="mt-3 fw-bold">CaliGuía Admin</h3>
            <p class="text-muted">Panel de administración</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="admin123" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>

        <div id="loginError" class="alert alert-danger mt-3 d-none"></div>

        <div class="text-center mt-4">
            <small class="text-muted">
                Usuario por defecto: <strong>admin</strong> / Contraseña: <strong>admin123</strong>
            </small>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const errorDiv = document.getElementById('loginError');

    try {
        const response = await fetch('/api/admin/login', {
            method: 'POST',
            body: formData,
        });
        const data = await response.json();

        if (data.success) {
            window.location.href = '/admin';
        } else {
            errorDiv.textContent = data.error || 'Error al iniciar sesión';
            errorDiv.classList.remove('d-none');
        }
    } catch (err) {
        errorDiv.textContent = 'Error de conexión';
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
